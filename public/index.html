<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI BET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #0c1424;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 { color: #42a5ff; }
.status { color: #39d98a; font-size: 12px; }

.welcome { margin-top: 35px; }
.welcome p { color: #9aa9bd; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

button {
  background: #192941;
  color: white;
  border: 1px solid #263d5c;
  border-radius: 16px;
  padding: 18px 10px;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}

button span {
  display: block;
  font-size: 27px;
  margin-bottom: 12px;
}

.content {
  margin-top: 25px;
  padding: 18px;
  background: #192941;
  border-radius: 16px;
  min-height: 100px;
  overflow-wrap: anywhere;
}

.match {
  padding: 12px;
  margin-bottom: 10px;
  background: #263d5c;
  border-radius: 12px;
}

.match button {
  width: 100%;
  margin-top: 12px;
  text-align: center;
  background: #1677e8;
}
</style>
</head>

<body>

<header>
  <h1>⚡ AI BET</h1>
  <div class="status">● ONLINE</div>
</header>

<section class="welcome">
  <h2>Спортивная аналитика</h2>
  <p>Добро пожаловать в AI BET!</p>
</section>

<div class="grid">
  <button type="button" onclick="document.getElementById('content').innerText='⏳ Загружаем матчи...' ; fetch('/api/matches').then(r=>r.json()).then(events=>{document.getElementById('content').innerText=events.map(e=>e.strEvent).join('\n') || 'Матчей нет'}).catch(()=>document.getElementById('content').innerText='Ошибка загрузки матчей')">
    <span>⚽</span>Матчи
  </button>

  <button type="button" onclick="document.getElementById('content').innerText='🤖 Сначала открой раздел Матчи и выбери матч.'">
    <span>🤖</span>AI-прогнозы
  </button>

  <button type="button" onclick="document.getElementById('content').innerText='📊 Здесь будет статистика.'">
    <span>📊</span>Статистика
  </button>

  <button type="button" onclick="document.getElementById('content').innerText='👤 Твой профиль AI BET.'">
    <span>👤</span>Профиль
  </button>
</div>

<div class="content" id="content">
  Выбери нужный раздел.
</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const content = document.getElementById("content");
window.currentEvents = [];

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

const content = document.getElementById("content");
window.currentEvents = [];

document.querySelectorAll("[data-section]").forEach(button => {
  button.addEventListener("click", () => {
    show(button.dataset.section);
  });
});

window.show = async function(section) {
  if (section === "matches") {
    content.innerHTML = "⏳ Загружаем матчи...";

    try {
      const response = await fetch("/api/matches");
      if (!response.ok) throw new Error("Ошибка загрузки: " + response.status);

      const events = await response.json();

      if (!Array.isArray(events) || events.length === 0) {
        content.innerText = "Сегодня матчей не найдено.";
        return;
      }

      window.currentEvents = events;

      content.innerHTML = events.map((event, index) => `
        <div class="match">
          <b>${event.strEvent || "Матч"}</b>

          🏆 ${event.strLeague || event.strSport || "Спорт"}<
          📅 ${event.dateEvent || ""}<b
         🕒 ${event.strTime || "Время неизвестно"}
          <button type="button" class="analyze-button" data-index="${index}">
            🤖 АНАЛИЗИРОВАТЬ
          </button>
          <div id="analysis-${index}"></div>
        </div>
      `).join("");

      document.querySelectorAll(".analyze-button").forEach(button => {
        button.addEventListener("click", () => {
          analyzeMatch(Number(button.dataset.index));
        });
      });

    } catch (error) {
      console.error(error);
      content.innerText = "❌ Ошибка: " + error.message;
    }
    return;
  }

  const messages = {
    analysis: "🤖 Сначала открой раздел Матчи и выбери матч.",
    stats: "📊 Здесь будет статистика.",
    profile: "👤 Твой профиль AI BET."
  };

  content.innerText = messages[section] || "Раздел";
};

async function analyzeMatch(index) {
  const event = window.currentEvents[index];
  const result = document.getElementById("analysis-" + index);

  if (!event || !result) return;

  result.innerText = "⏳ Анализируем...";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        match: event.strEvent,
        sport: event.strSport,
        league: event.strLeague
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка анализа");
    }

    result.innerHTML =
      "
<b>
роятность исходов:</b>
" +

  String(data.probabilities || "Нет результата").replace(/\n/g, "
");

 catch (error) {
    console.error(error);
    result.innerText = "❌ Ошибка анализа: " + error.message;
  }
}
</script>

</body>
</html>/
