<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI BET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #0c1424;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 { color: #42a5ff; }
.status { color: #39d98a; font-size: 12px; }

.welcome { margin-top: 35px; }
.welcome p { color: #9aa9bd; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

button {
  background: #192941;
  color: white;
  border: 1px solid #263d5c;
  border-radius: 16px;
  padding: 18px 10px;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}

button span {
  display: block;
  font-size: 27px;
  margin-bottom: 12px;
}

.content {
  margin-top: 25px;
  padding: 18px;
  background: #192941;
  border-radius: 16px;
  min-height: 100px;
  overflow-wrap: anywhere;
}

.match {
  padding: 12px;
  margin-bottom: 10px;
  background: #263d5c;
  border-radius: 12px;
}

.match button {
  width: 100%;
  margin-top: 12px;
  text-align: center;
  background: #1677e8;
}
</style>
</head>

<body>

<header>
  <h1>⚡ AI BET</h1>
  <div class="status">● ONLINE</div>
</header>

<section class="welcome">
  <h2>Спортивная аналитика</h2>
  <p>Добро пожаловать в AI BET!</p>
</section>

<div class="grid">
  <button type="button" onclick="
document.getElementById('content').innerHTML='⏳ Загружаем матчи...';
fetch('/api/matches')
.then(r=>r.json())
.then(events=>{
window.currentEvents=events;
document.getElementById('content').innerHTML=events.map((e,i)=>`
<div class='match'>
<b>${e.strEvent}</b>

<button type='button' onclick='analyzeMatch(${i})'>🤖 АНАЛИЗИРОВАТЬ</button>
<div id='analysis-${i}'></div>
</div>
`).join('');
})
.catch(error=>{
document.getElementById('content').innerText='Ошибка: '+error.message;
console.error(error);
});
">
<span>⚽</span>Матчи
</button>

  <button type="button" onclick="document.getElementById('content').innerText='🤖 Сначала открой раздел Матчи и выбери матч.'">
    <span>🤖</span>AI-прогнозы
  </button>

  <button type="button" onclick="document.getElementById('content').innerText='📊 Здесь будет статистика.'">
    <span>📊</span>Статистика
  </button>

  <button type="button" onclick="document.getElementById('content').innerText='👤 Твой профиль AI BET.'">
    <span>👤</span>Профиль
  </button>
</div>

<div class="content" id="content">
  Выбери нужный раздел.
</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

window.currentEvents = [];

window.loadMatches = async function() {
  const content = document.getElementById("content");
  content.innerText = "⏳ Загружаем матчи...";

  try {
    const response = await fetch("/api/matches");
    if (!response.ok) throw new Error("Ошибка загрузки матчей");

    const events = await response.json();
    window.currentEvents = events;

    if (!events.length) {
      content.innerText = "Сегодня матчей не найдено.";
      return;
    }

    content.innerHTML = events.map((e, i) => `
      <div class="match">
        <b>${e.strEvent || "Матч"}</b>

        🏆 ${e.strLeague || e.strSport || "Спорт"}<
        📅 ${e.dateEvent || ""}<b
       🕒 ${e.strTime || "Время неизвестно"}
        <button type="button" onclick="window.analyzeMatch(${i})">
          🤖 АНАЛИЗИРОВАТЬ
        </button>
        <div id="analysis-${i}"></div>
      </div>
    `).join("");

  } catch (error) {
    content.innerText = "❌ Ошибка загрузки матчей";
  }
};

window.analyzeMatch = async function(index) {
  const event = window.currentEvents[index];
  const result = document.getElementById("analysis-" + index);

  if (!event || !result) return;

  result.innerText = "⏳ Анализируем...";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        match: event.strEvent,
        sport: event.strSport,
        league: event.strLeague
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка анализа");
    }

    result.innerHTML =
      "

 Вероятность исходов:</b>
"
     String(data.probabilities || "Нет результата").replace(/\n/g, "
"
  } catch (error) {
    result.innerText = "❌ " + error.message;
  }
};
</script>

</body>
</html>};
</script>

</body>
</html>
