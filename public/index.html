<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI BET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 20px;
  background: #0c1424;
  color: white;
  font-family: Arial, sans-serif;
}
header { display:flex; justify-content:space-between; align-items:center; }
h1 { color:#42a5ff; }
.status { color:#39d98a; font-size:12px; }
.welcome { margin-top:35px; }
.welcome p { color:#9aa9bd; }
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:25px;
}
button {
  background:#192941;
  color:white;
  border:1px solid #263d5c;
  border-radius:16px;
  padding:22px 10px;
  font-size:16px;
  text-align:left;
}
button span { display:block; font-size:27px; margin-bottom:12px; }
.content {
  margin-top:25px;
  padding:18px;
  background:#192941;
  border-radius:16px;
  min-height:100px;
  overflow-wrap:anywhere;
}
.match {
  padding:12px;
  margin-bottom:10px;
  background:#263d5c;
  border-radius:12px;
}
</style>
</head>
<body>

<header>
<h1>⚡ AI BET</h1>
<div class="status">● ONLINE</div>
</header>

<section class="welcome">
<h2>Спортивная аналитика</h2>
<p>Добро пожаловать в AI BET!</p>
</section>

<div class="grid">
<button onclick="show('matches')"><span>⚽</span>Матчи</button>
<button onclick="show('analysis')"><span>🤖</span>AI-прогнозы</button>
<button onclick="show('stats')"><span>📊</span>Статистика</button>
<button onclick="show('profile')"><span>👤</span>Профиль</button>
</div>

<div class="content" id="content">
Выбери нужный раздел.
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

async function show(section) {
  const content = document.getElementById("content");

  if (section === "matches") {
    content.innerHTML = "⏳ Загружаем матчи...";

    try {
      const response = await fetch("/api/matches");
      if (!response.ok) throw new Error("API error");

      const events = await response.json();

      if (!events.length) {
        content.innerText = "Сегодня матчей не найдено.";
        return;
      }

      content.innerHTML = events.map(event => `
        <div class="match">
          <b>${event.strEvent || "Матч"}</b><br
        🏆 ${event.strLeague || event.strSport || "Спорт"}

       📅 ${event.dateEvent || ""}

      🕒 ${event.strTime || "Время неизвестно"}
        </div>
      `).join("");

    } catch (error) {
      content.innerText = "❌ Не удалось загрузить матчи. Попробуй позже.";
    }
    return;
  }

  const messages = {
    analysis: "🤖 Здесь будут AI-прогнозы.",
    stats: "📊 Здесь будет статистика.",
    profile: "👤 Твой профиль AI BET."
  };

  content.innerText = messages[section] || "Раздел";
}
</script>
</body>
</html>
