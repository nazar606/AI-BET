<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI BET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #0c1424;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 { color: #42a5ff; }
.status { color: #39d98a; font-size: 12px; }

.welcome { margin-top: 35px; }
.welcome p { color: #9aa9bd; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

button {
  background: #192941;
  color: white;
  border: 1px solid #263d5c;
  border-radius: 16px;
  padding: 18px 10px;
  font-size: 16px;
  text-align: left;
  cursor: pointer;
}

button span {
  display: block;
  font-size: 27px;
  margin-bottom: 12px;
}

.content {
  margin-top: 25px;
  padding: 18px;
  background: #192941;
  border-radius: 16px;
  min-height: 100px;
  overflow-wrap: anywhere;
}

.match {
  padding: 12px;
  margin-bottom: 10px;
  background: #263d5c;
  border-radius: 12px;
}

.match button {
  width: 100%;
  margin-top: 12px;
  text-align: center;
  background: #1677e8;
}
</style>
</head>

<body>

<header>
  <h1>⚡ AI BET</h1>
  <div class="status">● ONLINE</div>
</header>

<section class="welcome">
  <h2>Спортивная аналитика</h2>
  <p>Добро пожаловать в AI BET!</p>
</section>

<div class="grid">
  <button onclick="show('matches')">
    <span>⚽</span>Матчи
  </button>

  <button onclick="show('analysis')">
    <span>🤖</span>AI-прогнозы
  </button>

  <button onclick="show('stats')">
    <span>📊</span>Статистика
  </button>

  <button onclick="show('profile')">
    <span>👤</span>Профиль
  </button>
</div>

<div class="content" id="content">
  Выбери нужный раздел.
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

async function show(section) {
  const content = document.getElementById("content");

  if (section === "matches") {
    content.innerHTML = "⏳ Загружаем матчи...";

    try {
      const response = await fetch("/api/matches");

      if (!response.ok) {
        throw new Error("Ошибка загрузки матчей");
      }

      const events = await response.json();

      if (!events.length) {
        content.innerText = "Сегодня матчей не найдено.";
        return;
      }

      window.currentEvents = events;

      content.innerHTML = events.map((event, index) => `
        <div class="match">
          <b>${event.strEvent || "Матч"}</b><br
        🏆 ${event.strLeague || event.strSport || "Спорт"}

       📅 ${event.dateEvent || ""}

      🕒 ${event.strTime || "Время неизвестно"}

      <button type="button" onclick="window.analyzeMatch(${index})">
            🤖 АНАЛИЗИРОВАТЬ
          </button>

          <div id="analysis-${index}"></div>
        </div>
      `).join("");

    } catch (error) {
      console.error(error);
      content.innerText = "❌ Не удалось загрузить матчи. Попробуй позже.";
    }

    return;
  }

  const messages = {
    analysis: "🤖 Сначала открой раздел Матчи и выбери матч.",
    stats: "📊 Здесь будет статистика.",
    profile: "👤 Твой профиль AI BET."
  };

  content.innerText = messages[section] || "Раздел";
}

window.analyzeMatch = async function(index) {
  const event = window.currentEvents?.[index];
  const result = document.getElementById(`analysis-${index}`);

  if (!event || !result) return;

  result.innerHTML = "⏳ Анализируем...";

  try {
    const response = await fetch("/api/analyze", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        match: event.strEvent,
        sport: event.strSport,
        league: event.strLeague
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Ошибка анализа");
    }

    result.innerHTML =
      "
<b>📊 Вероятность исходов:</b><
 +
      data.probabilities;

  } catch (error) {
    console.error(error);
    result.innerText = "❌ Ошибка анализа. Проверь OpenAI API.";
  }
};
</script>
</body>
</html>
