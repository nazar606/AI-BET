<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI BET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #0c1424;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 { color: #42a5ff; }

.status { color: #39d98a; font-size: 12px; }

.welcome { margin-top: 25px; }
.welcome p { color: #9aa9bd; }

button {
  width: 100%;
  margin-top: 12px;
  background: #192941;
  color: white;
  border: 1px solid #263d5c;
  border-radius: 16px;
  padding: 18px;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
}

.content {
  margin-top: 20px;
  padding: 18px;
  background: #192941;
  border-radius: 16px;
  min-height: 100px;
  overflow-wrap: anywhere;
}

.match {
  padding: 15px;
  margin-bottom: 12px;
  background: #263d5c;
  border-radius: 12px;
  line-height: 1.8;
}

.match-name {
  font-size: 17px;
  font-weight: bold;
}

.info {
  color: #b8c7dc;
  font-size: 14px;
}

.crash-screen {
  background: #101d32;
  padding: 30px 10px;
  border-radius: 15px;
  margin: 15px 0;
  text-align: center;
  overflow: hidden;
}

#crash-plane {
  font-size: 55px;
  transition: transform 0.1s linear;
}

#crash-number {
  font-size: 45px;
  color: #39d98a;
}

.crash-history {
  text-align: center;
  line-height: 2;
}
</style>
</head>

<body>

<header>
  <h1>⚡ AI BET</h1>
  <div class="status">● ONLINE</div>
</header>

<section class="welcome">
  <h2>Спортивная платформа</h2>
  <p>Матчи и игра CRASH</p>
</section>

<button type="button" onclick="loadMatches()">
  ⚽ МАТЧИ
</button>

<button type="button" onclick="openCrash()">
  🚀 CRASH
</button>

<div class="content" id="content">
  Выбери нужный раздел.
</div>

<script>
const tg = window.Telegram?.WebApp;
alert("JAVASCRIPT РАБОТАЕТ");
if (tg) {
  tg.ready();
  tg.expand();
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "'"
  })[char]);
}

// СПОРТИВНЫЕ МАТЧИ

window.loadMatches = async function() {
  const content = document.getElementById("content");

  content.innerText = "⏳ Загружаем матчи...";

  try {
    const response = await fetch("/api/matches");

    if (!response.ok) {
      throw new Error("Ошибка API: " + response.status);
    }

    const data = await response.json();

    const events = Array.isArray(data)
      ? data
      : Array.isArray(data?.events)
        ? data.events
        : [];

    if (!events.length) {
      content.innerText = "Сегодня матчей не найдено.";
      return;
    }

    content.innerHTML = events.map(e => `
      <div class="match">
        <div class="match-name">
          ${escapeHtml(e.strEvent || "Матч")}
        </div>
        <div class="info">
          🏆 ${escapeHtml(e.strLeague || e.strSport || "Спорт")}<b
         📅 ${escapeHtml(e.dateEvent || "Дата неизвестна")}<br
        🕒 ${escapeHtml(e.strTime || "Время неизвестно")}
        </div>
      </div>
    `).join("");

  } catch (error) {
    content.innerText = "❌ " + error.message;
  }
};

// CRASH

window.crashTimer = null;
window.crashHistory = [];

window.openCrash = function() {
  clearInterval(window.crashTimer);

  const content = document.getElementById("content");

  content.innerHTML = `
    <div style="text-align:center">
      <h2 style="color:#42a5ff">🚀 CRASH</h2>

      <div class="crash-screen">
        <div id="crash-plane">✈️</div>
        <h1 id="crash-number">1.00x</h1>
        <div id="crash-status">Готов к запуску</div>
      </div>

      <button id="crash-start" onclick="startCrash()">
        🚀 НАЧАТЬ РАУНД
      </button>

      <h3>История раундов</h3>
      <div id="crash-history" class="crash-history">
        Пока нет раундов
      </div>
    </div>
  `;

  renderCrashHistory();
};

function renderCrashHistory() {
  const history = document.getElementById(


ash-history");
  if (!history) return;

  history.innerHTML = window.crashHistory.length
    ? window.crashHistory.map(x =>
        `<div>${escapeHtml(x)}</div>`
      ).join("")
    : "Пока нет раундов";
}

window.startCrash = function() {
  clearInterval(window.crashTimer);

  const number = document.getElementById("crash-number");
  const status = document.getElementById("crash-status");
  const plane = document.getElementById("crash-plane");
  const button = document.getElementById("crash-start");

  if (!number || !status || !plane || !button) return;

  let multiplier = 1;
  const crashAt = 1 + Math.random() * 9;

  number.style.color = "#39d98a";
  button.disabled = true;
  button.innerText = "✈️ ПОЛЁТ...";
  status.innerText = "Коэффициент растёт!";

  window.crashTimer = setInterval(() => {
    multiplier += 0.01 + multiplier * 0.012;

    number.innerText = multiplier.toFixed(2) + "x";

    plane.style.transform =
      "translateX(" + Math.min(multiplier * 8, 180) + "px)";

    if (multiplier >= crashAt) {
      clearInterval(window.crashTimer);

      const result = crashAt.toFixed(2) + "x";

      number.innerText = result;
      number.style.color = "#ff4545";
      status.innerText = "💥 CRASH! Самолёт упал.";

      plane.style.transform = "translate(180px, 30px) rotate(35deg)";

      window.crashHistory.unshift(result);
      window.crashHistory = window.crashHistory.slice(0, 10);

      renderCrashHistory();

      button.disabled = false;
      button.innerText = "🔄 НОВЫЙ РАУНД";
    }
  }, 100);
};
</script>

</body>
</html>"cr
