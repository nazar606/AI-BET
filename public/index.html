<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI BET</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 22px 18px;
  background:
    radial-gradient(ellipse at top, #30200f 0%, #111 42%, #080808 100%);
  color: #fff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 20px;
  border-bottom: 1px solid #332416;
}

h1 {
  color: #ff8a00;
  font-size: 29px;
  letter-spacing: 1px;
  text-shadow: 0 0 18px #ff800055;
}

.status {
  color: #ff9b28;
  font-size: 12px;
  font-weight: bold;
}

.welcome {
  margin: 28px 0 20px;
}

.welcome h2 {
  font-size: 25px;
  margin-bottom: 8px;
}

.welcome p {
  color: #999;
  font-size: 14px;
}

button {
  width: 100%;
  margin-top: 13px;
  background: linear-gradient(135deg, #ff9d22, #f05b00);
  color: #111;
  border: none;
  border-radius: 16px;
  padding: 19px;
  font-size: 17px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 5px 20px #ff780033;
  transition: 0.2s;
}

button:active {
  transform: scale(0.97);
}

button:disabled {
  opacity: 0.6;
}

.content {
  margin-top: 22px;
  padding: 18px;
  background: linear-gradient(145deg, #1b1b1b, #111);
  border: 1px solid #392817;
  border-radius: 18px;
  min-height: 110px;
  overflow-wrap: anywhere;
}

.match {
  padding: 16px;
  margin-bottom: 13px;
  background: #222;
  border: 1px solid #44301b;
  border-left: 4px solid #ff8700;
  border-radius: 13px;
  line-height: 1.8;
}

.match-name {
  font-size: 17px;
  font-weight: bold;
  color: #fff;
}

.info {
  color: #aaa;
  font-size: 14px;
}

.crash-screen {
  background:
    radial-gradient(circle at center, #38200b, #151515 70%);
  border: 1px solid #70400f;
  padding: 35px 10px;
  border-radius: 18px;
  margin: 18px 0;
  text-align: center;
  overflow: hidden;
}

#crash-plane {
  font-size: 60px;
  transition: transform 0.1s linear;
  filter: drop-shadow(0 0 12px #ff8a00);
}

#crash-number {
  font-size: 48px;
  color: #ff941c;
  text-shadow: 0 0 20px #ff780066;
}

.crash-history {
  text-align: center;
  line-height: 2.2;
  color: #ffad45;
}

#crash-status {
  color: #ffad45;
}





.feature-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 20px;
}

.feature-card {
  position: relative;
  min-height: 175px;
  margin: 0;
  padding: 18px 13px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: center;
  gap: 10px;
  background: linear-gradient(145deg, #25201a, #111);
  border: 1px solid #70400f;
  border-radius: 18px;
  color: white;
  text-align: left;
}

.feature-icon {
  font-size: 35px;
}

.feature-title {
  font-size: 19px;
  font-weight: 900;
  color: #ff941c;
}

.feature-description {
  font-size: 12px;
  color: #aaa;
}

.feature-arrow {
  position: absolute;
  right: 15px;
  bottom: 13px;
  color: #ff941c;
  font-size: 22px;
}





.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: #111;
  border-top: 1px solid #493018;
  padding: 10px 5px calc(10px + env(safe-area-inset-bottom));
  z-index: 1000;
}

.bottom-nav button {
  margin: 0;
  padding: 8px 2px;
  background: transparent;
  border: none;
  box-shadow: none;
  color: #999;
  font-size: 21px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
}

.bottom-nav button span {
  font-size: 10px;
}

.bottom-nav button:active {
  color: #ff941c;
}

body {
  padding-bottom: 100px;
}





/* AI BET CRASH 2.0 */

.crash-screen {
  position: relative;
  min-height: 280px;
  background: radial-gradient(circle at center, #30200e, #101010 75%);
  border: 1px solid #8a4b0c;
  border-radius: 20px;
  padding: 20px 12px;
  overflow: hidden;
  box-shadow: 0 0 25px #ff850022;
}

.crash-graph {
  width: 100%;
  height: 150px;
  margin-top: 15px;
  overflow: visible;
}

.crash-line {
  fill: none;
  stroke: #ff941c;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  filter: drop-shadow(0 0 7px #ff8500);
}

.crash-area {
  fill: url(#crashGradient);
}

.crash-history-item {
  display: inline-block;
  padding: 7px 11px;
  margin: 4px;
  border-radius: 9px;
  background: #30200e;
  border: 1px solid #8a4b0c;
  color: #ffad45;
  font-weight: bold;
}

.crash-status {
  color: #ffad45;
  font-weight: bold;
  margin-top: 8px;
}






</style>
</head>

<body>

<header>
  <h1>⚡ AI BET</h1>
  <div class="status">● ONLINE</div>
</header>

<section class="welcome">
  <h2>Спортивная платформа</h2>
  <p>Матчи и игра CRASH</p>
</section>

<div class="feature-grid">

  <button class="feature-card" type="button" onclick="loadMatches()">
    <span class="feature-icon">⚽</span>
    <span class="feature-title">МАТЧИ</span>
    <span class="feature-description">Спортивные события</span>
    <span class="feature-arrow">→</span>
  </button>

  <button class="feature-card" type="button" onclick="openCrash()">
    <span class="feature-icon">🚀</span>
    <span class="feature-title">CRASH</span>
    <span class="feature-description">Игра с коэффициентом</span>
    <span class="feature-arrow">→</span>
  </button>

</div>

<div class="content" id="content">
  Выбери нужный раздел.
</div>
<nav class="bottom-nav">
  <button onclick="goHome()">
    🏠<span>Главная</span>
  </button>

  <button onclick="loadMatches()">
    ⚽<span>Матчи</span>
  </button>

  <button onclick="openCrash()">
    🚀<span>CRASH</span>
  </button>

  <button onclick="openProfile()">
    👤<span>Профиль</span>
  </button>
</nav>
<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "'"
  })[char]);
}

// МАТЧИ

window.loadMatches = async function() {
  const content = document.getElementById("content");
  content.innerText = "⏳ Загружаем матчи...";

  try {
    const response = await fetch("/api/matches");

    if (!response.ok) {
      throw new Error("Ошибка API: " + response.status);
    }

    const data = await response.json();

    const events = Array.isArray(data)
      ? data
      : Array.isArray(data?.events)
        ? data.events
        : [];

    if (!events.length) {
      content.innerText = "Сегодня матчей не найдено.";
      return;
    }

    content.innerHTML = events.map(e => `
      <div class="match">
        <div class="match-name">
          ${escapeHtml(e.strEvent || "Матч")}
        </div>
        <div class="info">
          🏆 ${escapeHtml(e.strLeague || e.strSport || "Спорт")}<b
         📅 ${escapeHtml(e.dateEvent || "Дата неизвестна")}<br
        🕒 ${escapeHtml(e.strTime || "Время неизвестно")}
        </div>
      </div>
    `).join("");

  } catch (error) {
    content.innerText = "❌ " + error.message;
  }
};

// CRASH

window.crashTimer = null;
window.crashHistory = [];

window.openCrash = function() {
  clearInterval(window.crashTimer);

  const content = document.getElementById("content");

  content.innerHTML = `
    <div style="text-align:center">
      <h2 style="color:#42a5ff">🚀 CRASH</h2>

      <div class="crash-screen">
        <div id="crash-plane">✈️</div>
        <h1 id="crash-number">1.00x</h1>
        <div id="crash-status">Готов к запуску</div>
      </div>

      <button id="crash-start" onclick="startCrash()">
        🚀 НАЧАТЬ РАУНД
      </button>

      <h3>История раундов</h3>
      <div id="crash-history" class="crash-history">
        Пока нет раундов
      </div>
    </div>
  `;

  renderCrashHistory();
};

function renderCrashHistory() {
  const history = document.getElementById("crash-history")


if (!history) return;

  history.innerHTML = window.crashHistory.length
    ? window.crashHistory.map(x =>
        `<div>${escapeHtml(x)}</div>`
      ).join("")
    : "Пока нет раундов";
}

window.startCrash = function() {
  clearInterval(window.crashTimer);

  const number = document.getElementById("crash-number");
  const status = document.getElementById("crash-status");
  const plane = document.getElementById("crash-plane");
  const button = document.getElementById("crash-start");

  if (!number || !status || !plane || !button) return;

  let multiplier = 1;
  const crashAt = 1 + Math.random() * 9;

  number.style.color = "#39d98a";
  button.disabled = true;
  button.innerText = "✈️ ПОЛЁТ...";
  status.innerText = "Коэффициент растёт!";

  window.crashTimer = setInterval(() => {
    multiplier += 0.01 + multiplier * 0.012;

    number.innerText = multiplier.toFixed(2) + "x";

    plane.style.transform =
      "translateX(" + Math.min(multiplier * 8, 180) + "px)";

    if (multiplier >= crashAt) {
      clearInterval(window.crashTimer);

      const result = crashAt.toFixed(2) + "x";

      number.innerText = result;
      number.style.color = "#ff4545";
      status.innerText = "💥 CRASH! Самолёт упал.";

      plane.style.transform =
        "translate(180px, 30px) rotate(35deg)";

      window.crashHistory.unshift(result);
      window.crashHistory = window.crashHistory.slice(0, 10);

      renderCrashHistory();

      button.disabled = false;
      button.innerText = "🔄 НОВЫЙ РАУНД";
    }
  }, 100);
};
  window.openProfile = function() {
  const content = document.getElementById("content");

  const user = window.Telegram?.WebApp?.initDataUnsafe?.user;

  const name = user
    ? [user.first_name, user.last_name].filter(Boolean).join(" ")
    : "Гость";

  const username = user?.username
    ? "@" + user.username
    : "Не указан";

  const history = window.crashHistory || [];

  content.innerHTML = `
    <div style="text-align:center;padding:15px 0">
      <div style="
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  border:3px solid #ff941c;
  overflow:hidden;
  background:#38200b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
">
  ${user?.photo_url
    ? '<img src="' + escapeHtml(user.photo_url) + '" style="width:100%;height:100%;object-fit:cover">'
    : '👤'}
</div>

      <h2 style="color:#ff941c">${escapeHtml(name)}</h2>
      <p style="color:#999">${escapeHtml(username)}</p>
    </div>

    <h3 style="color:#ff941c">📊 Моя статистика</h3>

    <div class="match">
      <div>Раундов в истории</div>
      <h2 style="color:#ff941c">${history.length}</h2>
    </div>

    <h3 style="color:#ff941c">🚀 Последние результаты</h3>

    <div class="match">
      ${
        history.length
          ? history.map(x => `<div>${escapeHtml(x)}</div>`).join("")
          : "Пока нет сыгранных раундов"
      }
    </div>

    <h3 style="color:#ff941c">⚙️ Настройки</h3>
    <div class="match">
      <div>Приложение AI BET</div>
      <div class="info">Версия 1.0</div>
    </div>
  `;
};

window.goHome = function() {
  clearInterval(window.crashTimer);
  document.getElementById("content").innerHTML =
    "Выбери нужный раздел.";
};






</script>

</body>
</html>;
