<body>

<header>
  <h1>⚡ AI BET</h1>
  <div class="status">● ONLINE</div>
</header>

<section class="welcome">
  <h2>Спортивные матчи</h2>
  <p>Расписание спортивных событий</p>
</section>

<button type="button" onclick="loadMatches()">
  ⚽ ПОКАЗАТЬ МАТЧИ
</button>

<div class="content" id="content">
  Нажми «ПОКАЗАТЬ МАТЧИ».
</div>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "'"
  })[char]);
}

window.loadMatches = async function() {
  const content = document.getElementById("content");

  content.innerText = "⏳ Загружаем матчи...";

  try {
    const response = await fetch("/api/matches");

    if (!response.ok) {
      throw new Error("Ошибка API: " + response.status);
    }

    const data = await response.json();

    const events = Array.isArray(data)
      ? data
      : Array.isArray(data?.events)
        ? data.events
        : [];

    if (events.length === 0) {
      content.innerText = "Сегодня матчей не найдено.";
      return;
    }

    content.innerHTML = events.map(e => `
      <div class="match">
        <div class="match-name">
          ${escapeHtml(e.strEvent || "Матч")}
        </div>

        <div class="info">
          🏆 ${escapeHtml(e.strLeague || e.strSport || "Спорт")}<
          📅 ${escapeHtml(e.dateEvent || "Дата неизвестна")}<b
         🕒 ${escapeHtml(e.strTime || "Время неизвестно")}
        </div>
      </div>
    `).join("");

  } catch (error) {
    content.innerText = "❌ " + error.message;
  }
};
</script>

</body>

  }

  window.crashTimer = null;

window.openCrash = function() {
  const content = document.getElementById("content");

  clearInterval(window.crashTimer);

  content.innerHTML = `
    <div style="text-align:center;padding:15px">
      <h2 style="color:#42a5ff">🚀 CRASH</h2>

      <div id="crash-screen"
        style="background:#101d32;padding:35px 10px;border-radius:15px;margin:15px 0">
        <div id="crash-plane" style="font-size:55px">✈️</div>
        <h1 id="crash-number" style="font-size:45px;color:#39d98a">1.00x</h1>
        <div id="crash-status">Готов к запуску</div>
      </div>

      <button id="crash-start" onclick="startCrash()">
        🚀 НАЧАТЬ РАУНД
      </button>

      <h3>История раундов</h3>
      <div id="crash-history">Пока нет раундов</div>
    </div>
  `;
};

window.crashHistory = [];

window.startCrash = function() {
  clearInterval(window.crashTimer);

  const number = document.getElementById("crash-number");
  const status = document.getElementById("crash-status");
  const plane = document.getElementById("crash-plane");
  const button = document.getElementById("crash-start");

  let multiplier = 1.00;
  const crashAt = 1 + Math.random() * 9;

  button.disabled = true;
  button.innerText = "✈️ ПОЛЁТ...";
  status.innerText = "Коэффициент растёт!";

  window.crashTimer = setInterval(() => {
    multiplier += 0.01 + multiplier * 0.012;

    number.innerText = multiplier.toFixed(2) + "x";
    plane.style.transform =
      "translateX(" + Math.min(multiplier * 8, 180) + "px)";

    if (multiplier >= crashAt) {
      clearInterval(window.crashTimer);

      const result = crashAt.toFixed(2) + "x";

      number.innerText = result;
      number.style.color = "#ff4545";
      status.innerText = "💥 CRASH! Самолёт упал.";

      window.crashHistory.unshift(result);
      window.crashHistory = window.crashHistory.slice(0, 10);

      document.getElementById("crash-history").innerHTML =
        window.crashHistory.map(x =>
          `<div style="padding:7px">${x}</div>`
        ).join("");

      button.disabled = false;
      button.innerText = "🔄 НОВЫЙ РАУНД";
    }
  }, 100);
};
</script>
